<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Othello — Settings</title>
<link rel="icon" href="/othello/assets/favicon-BWXAriHn.ico">
  <script type="module" crossorigin src="/othello/assets/settings-DAB3fU-W.js"></script>
  <link rel="modulepreload" crossorigin href="/othello/assets/config-CyzAQnvf.js">
  <link rel="stylesheet" crossorigin href="/othello/assets/styles-6mLDlEpn.css">
</head>
<body>
  <header class="site-header">
    <img src="/othello/assets/logo-DcW5hfJY.png" alt="">
    <span class="brand">The Othello Corner</span>
    <nav aria-label="Main">
      <ul class="navbar">
        <li><a href="index.html">Play</a></li>
        <li><a href="rules.html">Rules &amp; History</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="settings.html" class="active" aria-current="page">Settings</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article class="content" style="max-width:560px">
      <h1>Settings</h1>
      <p>These are saved in your browser and apply to your next new game.</p>

      <div class="field">
        <label for="set-level">Difficulty (engine think time)</label>
        <select id="set-level"></select>
      </div>
      <div class="field">
        <label for="set-color">You play as</label>
        <select id="set-color">
          <option value="black">Black (move first)</option>
          <option value="white">White</option>
          <option value="random">Random</option>
        </select>
      </div>
      <div class="field">
        <label for="set-hints">Show legal-move hints</label>
        <input type="checkbox" id="set-hints">
      </div>
      <div class="field">
        <label for="set-animate">Animate disc placement</label>
        <input type="checkbox" id="set-animate">
      </div>
      <div class="field">
        <label for="set-sound">Sound effects</label>
        <input type="checkbox" id="set-sound">
      </div>

      <div class="btns" style="grid-template-columns:1fr 1fr;max-width:320px">
        <button id="reset">Reset defaults</button>
        <a href="index.html"><button class="primary" style="width:100%">Done</button></a>
      </div>
      <p id="saved" class="who" style="color:var(--accent);min-height:1.2em" role="status" aria-live="polite"></p>
    </article>
  </main>

</body>
</html>
